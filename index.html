<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lynbluu · Guitar Review</title>
<style>
  :root {
    --silver-1: #e8e8ec;
    --silver-2: #c8c8d0;
    --silver-3: #8a8a94;
    --dark-1: #050507;
    --muted:   #6a6a74;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Sarabun', 'Segoe UI', sans-serif;
    background: var(--dark-1);
    color: var(--silver-1);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(200,200,210,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(160,160,170,0.06) 0%, transparent 50%),
      linear-gradient(180deg, #0a0a0c 0%, #050507 50%, #0a0a0c 100%);
    z-index: -2;
  }
  .header { text-align: center; padding: 28px 20px 12px; }
  .header h1 {
    font-size: 1.6rem; letter-spacing: 10px; font-weight: 300;
    color: var(--silver-1); text-transform: uppercase;
    text-shadow: 0 0 40px rgba(200,200,210,0.4);
  }
  .header .sub {
    font-size: 0.65rem; letter-spacing: 5px; color: var(--muted);
    margin-top: 6px; text-transform: uppercase;
  }
  .stage { position: relative; max-width: 640px; margin: 0 auto; padding: 16px; }
  .review-lane {
    position: relative; height: 110px; overflow: hidden;
    pointer-events: none; z-index: 5;
  }
  .gif-box {
    width: min(78%, 380px); margin: 8px auto;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(200,200,210,0.1);
    border: 1px solid rgba(200,200,210,0.15);
    position: relative; z-index: 3; background: #0a0a0c;
  }
  .gif-box img { width: 100%; display: block; }

  .strings-box {
    position: relative; width: min(40%, 260px);
    margin: 30px auto; padding: 20px 0; z-index: 2;
  }
  .strings-box.disabled { display: none; }
  .string {
    position: relative; height: 3px; margin-bottom: 14px;
    border-radius: 3px;
    background: linear-gradient(90deg,
      transparent 0%, rgba(200,200,210,0.3) 10%,
      rgba(232,232,236,0.9) 50%,
      rgba(200,200,210,0.3) 90%, transparent 100%);
    box-shadow: 0 0 8px rgba(200,200,210,0.5), 0 0 20px rgba(200,200,210,0.2);
    cursor: pointer; transition: all 0.15s ease;
  }
  .string:last-child { margin-bottom: 0; }
  .string:hover {
    box-shadow: 0 0 12px rgba(232,232,236,1), 0 0 30px rgba(232,232,236,0.5);
  }
  .string[data-i="0"] { height: 2px; opacity: 0.7; }
  .string[data-i="1"] { height: 2.5px; opacity: 0.78; }
  .string[data-i="2"] { height: 3px; opacity: 0.85; }
  .string[data-i="3"] { height: 3.5px; opacity: 0.92; }
  .string[data-i="4"] { height: 4px; opacity: 1; }
  .string[data-i="5"] { height: 4.5px; opacity: 1; }
  .string.vibrating { animation: stringVib 0.5s ease-out; }
  @keyframes stringVib {
    0%   { transform: translateY(0) scaleY(1); }
    15%  { transform: translateY(-4px) scaleY(1.5); }
    30%  { transform: translateY(3px) scaleY(0.7); }
    45%  { transform: translateY(-2px) scaleY(1.3); }
    60%  { transform: translateY(2px) scaleY(0.85); }
    75%  { transform: translateY(-1px) scaleY(1.15); }
    100% { transform: translateY(0) scaleY(1); }
  }

  .bubble {
    position: absolute; width: 220px;
    background: linear-gradient(145deg, rgba(30,30,38,0.98), rgba(14,14,18,0.98));
    border: 1px solid rgba(200,200,210,0.25);
    border-radius: 14px; padding: 10px 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08);
    opacity: 0; will-change: transform, opacity;
    top: 50%; transform: translate(-50%, -50%);
  }
  .bubble .b-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 5px; gap: 10px;
  }
  .bubble .b-name { font-size: 0.82rem; font-weight: 700; color: var(--silver-1); }
  .bubble .b-stars { color: var(--silver-2); font-size: 0.7rem; text-shadow: 0 0 8px rgba(200,200,210,0.7); }
  .bubble .b-product {
    display: inline-block; font-size: 0.62rem;
    background: rgba(200,200,210,0.1);
    border: 1px solid rgba(200,200,210,0.25);
    color: var(--silver-3); padding: 2px 8px;
    border-radius: 6px; margin-bottom: 5px;
  }
  .bubble .b-time {
    font-size: 0.62rem;
    color: #6a6a74;
    margin-bottom: 5px;
    letter-spacing: 0.5px;
  }
  .bubble .b-text { font-size: 0.75rem; line-height: 1.45; color: #b8b8c0; font-style: italic; }
  .bubble .b-img {
    width: 100%; height: 60px; object-fit: cover;
    border-radius: 8px; margin-top: 6px;
    border: 1px solid rgba(200,200,210,0.15);
  }
  @keyframes floatLR {
    0%   { opacity: 0; transform: translate(-50%, -50%) translateX(-320px); }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) translateX(320px); }
  }

  .rating-bar { text-align: center; margin: 18px 0 12px; position: relative; z-index: 5; }
  .rating-score { font-size: 3rem; font-weight: 200; color: var(--silver-1); text-shadow: 0 0 40px rgba(200,200,210,0.5); line-height: 1; }
  .rating-stars-display { color: var(--silver-2); font-size: 1rem; letter-spacing: 8px; margin-top: 6px; }
  .rating-count { color: var(--muted); font-size: 0.7rem; letter-spacing: 4px; margin-top: 8px; text-transform: uppercase; }

  .pagination { display: flex; justify-content: center; gap: 10px; margin: 18px 0 22px; flex-wrap: wrap; position: relative; z-index: 5; }
  .page-btn {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(145deg, #1a1a20, #0e0e12);
    border: 1px solid rgba(200,200,210,0.2);
    color: var(--silver-3); font-size: 0.95rem; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.25s;
  }
  .page-btn:hover { border-color: var(--silver-2); color: var(--silver-1); transform: translateY(-2px); }
  .page-btn.active {
    background: linear-gradient(145deg, #d8d8e0, #a8a8b0);
    color: #0a0a0c; border-color: var(--silver-1);
    box-shadow: 0 0 30px rgba(200,200,210,0.4);
  }

  .btn-review {
    display: block; margin: 6px auto 30px; padding: 15px 56px;
    background: linear-gradient(145deg, #2a2a32, #141418);
    color: var(--silver-1); border: 1px solid rgba(200,200,210,0.4);
    border-radius: 50px; font-size: 0.9rem; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase;
    cursor: pointer; font-family: inherit; transition: all 0.3s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative; z-index: 5;
  }
  .btn-review:hover {
    background: linear-gradient(145deg, #3a3a44, #1e1e24);
    border-color: var(--silver-2);
    box-shadow: 0 14px 40px rgba(0,0,0,0.7), 0 0 40px rgba(200,200,210,0.25);
    transform: translateY(-2px);
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(5,5,7,0.88); backdrop-filter: blur(12px);
    display: none; justify-content: center; align-items: center;
    z-index: 100; padding: 20px;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: linear-gradient(180deg, #16161c, #0e0e12);
    border: 1px solid rgba(200,200,210,0.25);
    border-radius: 22px; width: 100%; max-width: 460px;
    max-height: 92vh; overflow-y: auto; padding: 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    animation: modalIn 0.4s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .modal-title { font-size: 1rem; font-weight: 600; color: var(--silver-1); letter-spacing: 5px; text-transform: uppercase; }
  .modal-close {
    background: none; border: 1px solid rgba(200,200,210,0.25);
    color: var(--silver-3); width: 34px; height: 34px; border-radius: 50%;
    cursor: pointer; font-size: 1rem; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.25s; font-family: inherit;
  }
  .modal-close:hover { border-color: var(--silver-1); color: var(--silver-1); transform: rotate(90deg); }

  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 0.7rem; letter-spacing: 3px;
    text-transform: uppercase; color: var(--silver-3); margin-bottom: 8px;
  }
  .field input[type="text"], .field textarea, .field select {
    width: 100%; padding: 12px 14px;
    background: #0a0a0e;
    border: 1px solid rgba(200,200,210,0.18);
    border-radius: 10px; color: var(--silver-1);
    font-size: 0.9rem; font-family: inherit;
    outline: none; resize: vertical;
  }
  .field textarea { min-height: 90px; }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: rgba(200,200,210,0.6);
    box-shadow: 0 0 0 3px rgba(200,200,210,0.1);
  }

  .star-picker { display: flex; gap: 8px; font-size: 1.8rem; line-height: 1; }
  .star-picker .s { cursor: pointer; color: #2a2a32; transition: all 0.2s; user-select: none; }
  .star-picker .s.active { color: var(--silver-1); text-shadow: 0 0 16px rgba(200,200,210,0.9); }

  .upload-box {
    position: relative; border: 1.5px dashed rgba(200,200,210,0.3);
    border-radius: 12px; padding: 22px; text-align: center;
    cursor: pointer; background: rgba(20,20,26,0.6); overflow: hidden;
  }
  .upload-box:hover { border-color: rgba(200,200,210,0.6); background: rgba(30,30,38,0.8); }
  .upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-box .up-icon { font-size: 1.6rem; margin-bottom: 6px; filter: grayscale(1) brightness(1.6); }
  .upload-box .up-text { font-size: 0.78rem; color: var(--silver-3); }
  .upload-preview { display: none; width: 100%; max-height: 180px; object-fit: contain; border-radius: 10px; }
  .upload-box.has-image .up-icon, .upload-box.has-image .up-text { display: none; }
  .upload-box.has-image { padding: 8px; }
  .upload-box.has-image .upload-preview { display: block; }

  .btn-submit {
    width: 100%; padding: 15px;
    background: linear-gradient(145deg, #d8d8e0, #a8a8b0);
    color: #0a0a0c; border: none; border-radius: 12px;
    font-size: 0.9rem; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 8px;
  }
  .btn-submit:hover { transform: translateY(-2px); }

  .footer { text-align: center; padding: 24px 20px; color: #3a3a42; font-size: 0.62rem; letter-spacing: 4px; text-transform: uppercase; }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: linear-gradient(145deg, #2a2a32, #141418);
    border: 1px solid rgba(200,200,210,0.4);
    color: var(--silver-1); padding: 12px 26px;
    border-radius: 50px; font-size: 0.82rem; letter-spacing: 2px;
    opacity: 0; transition: all 0.4s; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 500px) {
    .header h1 { font-size: 1.2rem; letter-spacing: 6px; }
    .bubble { width: 190px; padding: 8px 11px; }
    .review-lane { height: 100px; }
    .strings-box { width: 55%; }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="shopName">Lynbluu</h1>
  <div class="sub" id="shopSub">Guitar Review · Premium Store</div>
</div>

<div class="stage">
  <div class="gif-box">
    <img id="gif1" src="" alt="GIF 1" style="display:none">
  </div>

  <div class="review-lane" id="lane1"></div>

  <div class="strings-box" id="stringsBox">
    <div class="string" data-note="E2" data-i="0"></div>
    <div class="string" data-note="A2" data-i="1"></div>
    <div class="string" data-note="D3" data-i="2"></div>
    <div class="string" data-note="G3" data-i="3"></div>
    <div class="string" data-note="B3" data-i="4"></div>
    <div class="string" data-note="E4" data-i="5"></div>
  </div>

  <div class="review-lane" id="lane2"></div>

  <div class="gif-box">
    <img id="gif2" src="" alt="GIF 2" style="display:none">
  </div>

  <div class="review-lane" id="lane3"></div>
</div>

<div class="rating-bar">
  <div class="rating-score" id="avgScore">0.0</div>
  <div class="rating-stars-display" id="avgStars">☆☆☆☆☆</div>
  <div class="rating-count"><span id="reviewCount">0</span> รีวิวจากลูกค้า</div>
</div>

<div class="pagination" id="pagination"></div>

<button class="btn-review" onclick="openModal()">✎ เขียนรีวิว</button>

<div class="footer">
  <span id="shopNameFooter">Lynbluu</span> © 2026 · Guitar Review System
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title">เขียนรีวิว</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="field">
      <label>ชื่อของคุณ</label>
      <input type="text" id="inpName" placeholder="กรอกชื่อ" maxlength="30">
    </div>

    <div class="field">
      <label>สินค้าที่ซื้อ</label>
      <select id="inpProduct"></select>
    </div>

    <div class="field">
      <label>คะแนน</label>
      <div class="star-picker" id="starPicker">
        <span class="s" data-v="1">★</span>
        <span class="s" data-v="2">★</span>
        <span class="s" data-v="3">★</span>
        <span class="s" data-v="4">★</span>
        <span class="s" data-v="5">★</span>
      </div>
    </div>

    <div class="field">
      <label>รูปภาพ (1 รูป)</label>
      <div class="upload-box" id="uploadBox">
        <input type="file" id="inpImage" accept="image/*">
        <div class="up-icon">📷</div>
        <div class="up-text">แตะเพื่ออัปโหลดรูป</div>
        <img class="upload-preview" id="uploadPreview" alt="">
      </div>
    </div>

    <div class="field">
      <label>ข้อความรีวิว</label>
      <textarea id="inpText" placeholder="เขียนรีวิว..." maxlength="200"></textarea>
    </div>

    <button class="btn-submit" onclick="submitReview()">ส่งรีวิว</button>
  </div>
</div>

<div class="toast" id="toast">✓ ส่งรีวิวสำเร็จ</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCdp51I7weDauemgnlnYku7bwcSr5NOaM",
  authDomain: "lynbluu-guitar.firebaseapp.com",
  projectId: "lynbluu-guitar",
  storageBucket: "lynbluu-guitar.firebasestorage.app",
  messagingSenderId: "957850224987",
  appId: "1:957850224987:web:c116779e8f564623a6327e",
  measurementId: "G-D561KQJRPH"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let reviews = [];
let products = [];
let rating = 0;
let uploadedImage = null;
let currentPage = 1;
const PER_PAGE = 9;

let settings = {
  shopName: 'Lynbluu',
  shopSub: 'Guitar Review · Premium Store',
  gif1: '',
  gif2: '',
  stringsEnabled: true
};

// ===== TIME FORMAT: HH:MM DD/MM/YYYY =====
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const Y = d.getFullYear();
  const M = String(d.getMonth() + 1).padStart(2, '0');
  const D = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m + ' ' + D + '-' + M + '-' + Y;
}

// ===== SETTINGS =====
async function loadSettings() {
  try {
    const ref = doc(db, 'settings', 'main');
    const snap = await getDoc(ref);
    if (snap.exists()) settings = { ...settings, ...snap.data() };
    applySettings();
  } catch(e) {
    console.error('Settings error:', e);
    applySettings();
  }
}

function applySettings() {
  document.getElementById('shopName').textContent = settings.shopName;
  document.getElementById('shopNameFooter').textContent = settings.shopName;
  document.getElementById('shopSub').textContent = settings.shopSub;
  document.title = settings.shopName + ' · Guitar Review';

  const g1 = document.getElementById('gif1');
  const g2 = document.getElementById('gif2');
  if (settings.gif1) { g1.src = settings.gif1; g1.style.display = 'block'; }
  if (settings.gif2) { g2.src = settings.gif2; g2.style.display = 'block'; }
  document.getElementById('stringsBox').classList.toggle('disabled', !settings.stringsEnabled);
}

// ===== PRODUCTS =====
function loadProducts() {
  const q = query(collection(db, 'products'), orderBy('name'));
  onSnapshot(q, (snap) => {
    products = [];
    snap.forEach(d => products.push({ id: d.id, ...d.data() }));
    renderProductSelect();
  }, (err) => console.error('Products error:', err));
}

function renderProductSelect() {
  const sel = document.getElementById('inpProduct');
  sel.innerHTML = '<option value="">-- เลือกสินค้า --</option>';
  products.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name;
    sel.appendChild(opt);
  });
}

// ===== REVIEWS =====
function loadReviews() {
  const q = query(collection(db, 'reviews'), orderBy('createdAt', 'desc'));
  onSnapshot(q, (snap) => {
    reviews = [];
    snap.forEach(d => reviews.push({ id: d.id, ...d.data() }));
    updateSummary();
    renderPagination();
    startBubbles();
  }, (err) => console.error('Reviews error:', err));
}

// ===== AUDIO =====
let audioCtx = null, masterGain = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.35;
  masterGain.connect(audioCtx.destination);
}
function makeDistortionCurve(amount) {
  amount = amount || 50;
  const n = 44100, curve = new Float32Array(n), deg = Math.PI / 180;
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
  }
  return curve;
}
function playString(freq) {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = freq;
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.value = freq * 2;
  osc2.detune.value = 8;
  const dist = audioCtx.createWaveShaper();
  dist.curve = makeDistortionCurve(80);
  dist.oversample = '4x';
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 3200;
  filter.Q.value = 1.5;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.9, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.4, now + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
  osc.connect(dist); osc2.connect(dist);
  dist.connect(filter); filter.connect(gain);
  gain.connect(masterGain);
  osc.start(now); osc2.start(now);
  osc.stop(now + 1.3); osc2.stop(now + 1.3);
}
const NOTE_FREQ = { E2: 82.41, A2: 110.00, D3: 146.83, G3: 196.00, B3: 246.94, E4: 329.63 };

document.querySelectorAll('.string').forEach(str => {
  str.addEventListener('click', () => {
    playString(NOTE_FREQ[str.dataset.note]);
    str.classList.remove('vibrating');
    void str.offsetWidth;
    str.classList.add('vibrating');
    setTimeout(() => str.classList.remove('vibrating'), 500);
  });
});

// ===== BUBBLES =====
function spawnBubble(review, laneId) {
  const lane = document.getElementById(laneId);
  if (!lane) return;
  const b = document.createElement('div');
  b.className = 'bubble';
  const stars = '★'.repeat(review.stars) + '☆'.repeat(5 - review.stars);
  const timeAgo = formatTime(review.createdAt);
  b.innerHTML =
    '<div class="b-head">' +
      '<span class="b-name">' + escapeHtml(review.name) + '</span>' +
      '<span class="b-stars">' + stars + '</span>' +
    '</div>' +
    '<span class="b-product">' + escapeHtml(review.product) + '</span>' +
    '<div class="b-time"> ' + timeAgo + '</div>' +
    '<div class="b-text">' + escapeHtml(review.text) + '</div>' +
    (review.img ? '<img class="b-img" src="' + review.img + '" alt="">' : '');
  lane.appendChild(b);
  const duration = 6 + Math.random() * 2;
  b.style.animation = 'floatLR ' + duration + 's linear forwards';
  setTimeout(() => b.remove(), duration * 1000 + 100);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// ===== TIMERS =====
let bubbleTimers = [];
function clearBubbleTimers() {
  bubbleTimers.forEach(t => clearInterval(t));
  bubbleTimers = [];
}
function startBubbles() {
  clearBubbleTimers();
  ['lane1','lane2','lane3'].forEach(id => document.getElementById(id).innerHTML = '');
  const start = (currentPage - 1) * PER_PAGE;
  const pageReviews = reviews.slice(start, start + PER_PAGE);
  if (pageReviews.length === 0) return;

  const group1 = pageReviews.filter((_, i) => i % 3 === 0);
  const group2 = pageReviews.filter((_, i) => i % 3 === 1);
  const group3 = pageReviews.filter((_, i) => i % 3 === 2);
  const lanes = [
    { id: 'lane1', group: group1 },
    { id: 'lane2', group: group2 },
    { id: 'lane3', group: group3 }
  ];

  if (currentPage === 1) {
    lanes.forEach(lane => {
      if (!lane.group.length) return;
      let i = 0;
      spawnBubble(lane.group[0], lane.id);
      const t = setInterval(() => {
        i++;
        spawnBubble(lane.group[i % lane.group.length], lane.id);
      }, 3500);
      bubbleTimers.push(t);
    });
  } else if (currentPage === 2) {
    lanes.forEach((lane, idx) => {
      if (!lane.group.length) return;
      setTimeout(() => {
        let i = 0;
        spawnBubble(lane.group[0], lane.id);
        const t = setInterval(() => {
          i++;
          spawnBubble(lane.group[i % lane.group.length], lane.id);
        }, 3500);
        bubbleTimers.push(t);
      }, idx * 900);
    });
  } else {
    [...lanes].reverse().forEach((lane, idx) => {
      if (!lane.group.length) return;
      setTimeout(() => {
        let i = 0;
        spawnBubble(lane.group[0], lane.id);
        const t = setInterval(() => {
          i++;
          spawnBubble(lane.group[i % lane.group.length], lane.id);
        }, 3500);
        bubbleTimers.push(t);
      }, idx * 900);
    });
  }
}

// ===== PAGINATION =====
function renderPagination() {
  const totalPages = Math.ceil(reviews.length / PER_PAGE);
  const box = document.getElementById('pagination');
  box.innerHTML = '';
  for (let p = 1; p <= totalPages; p++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
    btn.textContent = p;
    btn.onclick = () => gotoPage(p);
    box.appendChild(btn);
  }
  if (currentPage < totalPages) {
    const next = document.createElement('button');
    next.className = 'page-btn';
    next.textContent = '→';
    next.onclick = () => gotoPage(currentPage + 1);
    box.appendChild(next);
  }
}
function gotoPage(p) { currentPage = p; renderPagination(); startBubbles(); }

// ===== SUMMARY =====
function updateSummary() {
  const count = reviews.length;
  document.getElementById('reviewCount').textContent = count;
  if (count === 0) {
    document.getElementById('avgScore').textContent = '0.0';
    document.getElementById('avgStars').textContent = '☆☆☆☆☆';
    return;
  }
  const avg = reviews.reduce((s, r) => s + r.stars, 0) / count;
  const rounded = Math.round(avg);
  document.getElementById('avgScore').textContent = avg.toFixed(1);
  document.getElementById('avgStars').textContent = '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
}

// ===== MODAL =====
function openModal() { document.getElementById('modalOverlay').classList.add('active'); }
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  resetForm();
}
function resetForm() {
  document.getElementById('inpName').value = '';
  document.getElementById('inpProduct').value = '';
  document.getElementById('inpText').value = '';
  document.getElementById('inpImage').value = '';
  document.getElementById('uploadPreview').src = '';
  document.getElementById('uploadBox').classList.remove('has-image');
  uploadedImage = null;
  rating = 0;
  updateStars();
}
window.openModal = openModal;
window.closeModal = closeModal;

// ===== STARS =====
function updateStars() {
  document.querySelectorAll('#starPicker .s').forEach(s => {
    s.classList.toggle('active', +s.dataset.v <= rating);
  });
}
document.querySelectorAll('#starPicker .s').forEach(s => {
  s.addEventListener('click', () => { rating = +s.dataset.v; updateStars(); });
});

// ===== UPLOAD =====
document.getElementById('inpImage').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 800 * 1024) {
    showToast('⚠ รูปใหญ่เกิน 800KB');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    uploadedImage = ev.target.result;
    document.getElementById('uploadPreview').src = uploadedImage;
    document.getElementById('uploadBox').classList.add('has-image');
  };
  reader.readAsDataURL(file);
});

// ===== SUBMIT =====
async function submitReview() {
  const name = document.getElementById('inpName').value.trim();
  const product = document.getElementById('inpProduct').value;
  const text = document.getElementById('inpText').value.trim();

  if (!name) return showToast('⚠ กรุณากรอกชื่อ');
  if (!product) return showToast('⚠ กรุณาเลือกสินค้า');
  if (rating === 0) return showToast('⚠ กรุณาให้คะแนน');
  if (!text) return showToast('⚠ กรุณาเขียนรีวิว');

  try {
    await addDoc(collection(db, 'reviews'), {
      name: name, product: product, stars: rating, text: text,
      img: uploadedImage,
      createdAt: Date.now()
    });
    closeModal();
    showToast('✓ ส่งรีวิวสำเร็จ');
  } catch (e) {
    console.error(e);
    showToast('⚠ เกิดข้อผิดพลาด');
  }
}
window.submitReview = submitReview;

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ===== INIT =====
await loadSettings();
loadProducts();
loadReviews();

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
