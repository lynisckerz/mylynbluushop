<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Lynbluu</title>
<style>
  :root {
    --silver-1: #e8e8ec;
    --silver-2: #c8c8d0;
    --silver-3: #8a8a94;
    --dark-1: #050507;
    --muted:   #6a6a74;
    --danger:  #dc2626;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Sarabun', 'Segoe UI', sans-serif;
    background: var(--dark-1);
    color: var(--silver-1);
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(200,200,210,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(160,160,170,0.05) 0%, transparent 50%),
      linear-gradient(180deg, #0a0a0c 0%, #050507 50%, #0a0a0c 100%);
    z-index: -1;
  }

  .login-screen {
    position: fixed; inset: 0;
    display: flex; justify-content: center; align-items: center;
    padding: 20px; z-index: 100;
  }
  .login-box {
    background: linear-gradient(180deg, #16161c, #0e0e12);
    border: 1px solid rgba(200,200,210,0.25);
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%; max-width: 400px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    animation: modalIn 0.5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .login-box h1 {
    font-size: 1.2rem; text-align: center;
    color: var(--silver-1); letter-spacing: 5px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .login-box .sub {
    text-align: center; color: var(--muted);
    font-size: 0.7rem; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 26px;
  }
  .login-box input {
    width: 100%; padding: 13px 15px;
    background: #0a0a0e;
    border: 1px solid rgba(200,200,210,0.18);
    border-radius: 10px; color: var(--silver-1);
    font-size: 0.9rem; font-family: inherit;
    outline: none; margin-bottom: 12px;
    transition: all 0.25s;
  }
  .login-box input:focus {
    border-color: rgba(200,200,210,0.6);
    box-shadow: 0 0 0 3px rgba(200,200,210,0.1);
  }
  .btn-login {
    width: 100%; padding: 14px;
    background: linear-gradient(145deg, #d8d8e0, #a8a8b0);
    color: #0a0a0c; border: none; border-radius: 12px;
    font-size: 0.9rem; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
    transition: all 0.25s; margin-top: 8px;
  }
  .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(200,200,210,0.3); }
  .btn-login:disabled { opacity: 0.5; cursor: wait; }

  .dashboard { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
  .dashboard.active { display: block; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid rgba(200,200,210,0.15);
  }
  .top-bar h1 { font-size: 1.1rem; letter-spacing: 4px; color: var(--silver-1); text-transform: uppercase; }
  .btn-logout {
    padding: 8px 20px; background: transparent;
    border: 1px solid rgba(200,200,210,0.3);
    color: var(--silver-2); border-radius: 8px;
    cursor: pointer; font-family: inherit;
    font-size: 0.75rem; letter-spacing: 2px;
    transition: all 0.25s;
  }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  .card {
    background: linear-gradient(180deg, #16161c, #0e0e12);
    border: 1px solid rgba(200,200,210,0.18);
    border-radius: 16px; padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .card h2 {
    font-size: 0.9rem; letter-spacing: 4px;
    text-transform: uppercase; color: var(--silver-2);
    margin-bottom: 18px;
    display: flex; justify-content: space-between; align-items: center;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 0.68rem;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--silver-3); margin-bottom: 6px;
  }
  .field input[type="text"], .field textarea {
    width: 100%; padding: 11px 13px;
    background: #0a0a0e;
    border: 1px solid rgba(200,200,210,0.18);
    border-radius: 9px; color: var(--silver-1);
    font-size: 0.88rem; font-family: inherit;
    outline: none; resize: vertical; transition: all 0.25s;
  }
  .field textarea { min-height: 90px; }
  .field input:focus, .field textarea:focus {
    border-color: rgba(200,200,210,0.6);
    box-shadow: 0 0 0 3px rgba(200,200,210,0.1);
  }

  .btn {
    padding: 11px 24px;
    background: linear-gradient(145deg, #2a2a32, #141418);
    color: var(--silver-1);
    border: 1px solid rgba(200,200,210,0.3);
    border-radius: 9px; font-family: inherit;
    font-size: 0.82rem; font-weight: 600;
    letter-spacing: 2px; cursor: pointer;
    transition: all 0.25s;
  }
  .btn:hover { border-color: var(--silver-1); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(145deg, #d8d8e0, #a8a8b0); color: #0a0a0c; border: none; }
  .btn.danger { color: var(--danger); border-color: rgba(220,38,38,0.4); }
  .btn.danger:hover { background: rgba(220,38,38,0.15); border-color: var(--danger); }
  .btn.small { padding: 6px 14px; font-size: 0.72rem; }

  .toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0;
  }
  .toggle-switch {
    position: relative; width: 52px; height: 28px;
    background: #2a2a32; border-radius: 14px;
    cursor: pointer; transition: all 0.3s;
    border: 1px solid rgba(200,200,210,0.2);
  }
  .toggle-switch::after {
    content: ''; position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    background: #6a6a74; border-radius: 50%;
    transition: all 0.3s;
  }
  .toggle-switch.on {
    background: linear-gradient(145deg, #d8d8e0, #a8a8b0);
    border-color: var(--silver-1);
  }
  .toggle-switch.on::after { left: 27px; background: #0a0a0c; }

  .list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px;
    background: rgba(20,20,26,0.6);
    border: 1px solid rgba(200,200,210,0.12);
    border-radius: 10px; margin-bottom: 8px; gap: 12px;
  }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .info .name { font-size: 0.88rem; font-weight: 600; color: var(--silver-1); word-break: break-word; }
  .list-item .info .meta { font-size: 0.7rem; color: var(--silver-3); margin-top: 3px; word-break: break-word; }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: linear-gradient(145deg, #2a2a32, #141418);
    border: 1px solid rgba(200,200,210,0.4);
    color: var(--silver-1); padding: 12px 26px;
    border-radius: 50px; font-size: 0.82rem;
    letter-spacing: 1px; opacity: 0;
    transition: all 0.4s; z-index: 200;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }

  .empty { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 20px; letter-spacing: 1px; }

  @media (max-width: 500px) {
    .dashboard { padding: 12px; }
    .card { padding: 16px; }
    .list-item { padding: 10px; }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>Admin Login</h1>
    <div class="sub">Lynbluu · Secure Panel</div>
    <input type="email" id="inpEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="inpPass" placeholder="Password" autocomplete="current-password" onkeypress="if(event.key==='Enter')doLogin()">
    <button class="btn-login" id="btnLogin" onclick="doLogin()">Login</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <h1>⚙ Admin Panel</h1>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>

  <div class="card">
    <h2>🏪 ตั้งค่าร้าน</h2>
    <div class="field"><label>ชื่อร้าน</label><input type="text" id="setShopName"></div>
    <div class="field"><label>คำโปรย (Sub)</label><input type="text" id="setShopSub"></div>
    <div class="field"><label>GIF 1 (บน) — URL</label><input type="text" id="setGif1" placeholder="https://...gif"></div>
    <div class="field"><label>GIF 2 (ล่าง) — URL</label><input type="text" id="setGif2" placeholder="https://...gif"></div>
    <div class="toggle-row">
      <label style="margin:0; letter-spacing:2px; font-size:0.8rem; color:var(--silver-2); text-transform:uppercase;">🎸 เปิดใช้งานสายกีตาร์</label>
      <div class="toggle-switch" id="toggleStrings" onclick="toggleStrings()"></div>
    </div>
    <div style="margin-top:18px; text-align:right;">
      <button class="btn primary" onclick="saveSettings()">บันทึกการตั้งค่า</button>
    </div>
  </div>

  <div class="card">
    <h2>📦 จัดการสินค้า</h2>
    <div class="field">
      <label>เพิ่มสินค้า (1 บรรทัด = 1 สินค้า)</label>
      <textarea id="inpNewProducts" placeholder="ตัวอย่าง:&#10;Ibanez RG550&#10;Fender Stratocaster&#10;Gibson Les Paul"></textarea>
    </div>
    <div style="text-align:right; margin-bottom:16px;">
      <button class="btn primary" onclick="addProducts()">+ เพิ่มสินค้า</button>
    </div>
    <div id="productsList"><div class="empty">ยังไม่มีสินค้า</div></div>
  </div>

  <div class="card">
    <h2>💬 จัดการรีวิว</h2>
    <div id="reviewsList"><div class="empty">ยังไม่มีรีวิว</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, getDoc,
  setDoc, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

// ========== Firebase Config ==========
const firebaseConfig = {
  apiKey: "AIzaSyCCdp51I7weDauemgnlnYku7bwcSr5NOaM",
  authDomain: "lynbluu-guitar.firebaseapp.com",
  projectId: "lynbluu-guitar",
  storageBucket: "lynbluu-guitar.firebasestorage.app",
  messagingSenderId: "957850224987",
  appId: "1:957850224987:web:c116779e8f564623a6327e",
  measurementId: "G-D561KQJRPH"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentSettings = { shopName:'Lynbluu', shopSub:'', gif1:'', gif2:'', stringsEnabled:true };
let products = [];
let reviews = [];
let unsubProducts, unsubReviews;

// ========== Auth ==========
async function doLogin() {
  const email = document.getElementById('inpEmail').value.trim();
  const pass  = document.getElementById('inpPass').value;
  const btn   = document.getElementById('btnLogin');

  if (!email || !pass) return showToast('⚠ กรอกอีเมลและรหัสผ่าน', 'error');

  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    showToast('✓ เข้าสู่ระบบสำเร็จ', 'success');
  } catch (e) {
    console.error(e);
    let msg = '✕ เข้าสู่ระบบไม่สำเร็จ';
    if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
      msg = '✕ อีเมลหรือรหัสผ่านไม่ถูกต้อง';
    } else if (e.code === 'auth/too-many-requests') {
      msg = '✕ ลองหลายครั้งเกินไป รอสักครู่';
    } else if (e.code === 'auth/invalid-email') {
      msg = '✕ อีเมลไม่ถูกต้อง';
    }
    showToast(msg, 'error');
    document.getElementById('inpPass').value = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}
window.doLogin = doLogin;

async function doLogout() {
  await signOut(auth);
  showToast('✓ ออกจากระบบแล้ว', 'success');
}
window.doLogout = doLogout;

// ตรวจสอบสถานะ login
onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    await initData();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').classList.remove('active');
    if (unsubProducts) unsubProducts();
    if (unsubReviews) unsubReviews();
  }
});

// ========== Init Data ==========
async function initData() {
  // Settings
  const sSnap = await getDoc(doc(db, 'settings', 'main'));
  if (sSnap.exists()) currentSettings = { ...currentSettings, ...sSnap.data() };

  document.getElementById('setShopName').value = currentSettings.shopName || '';
  document.getElementById('setShopSub').value  = currentSettings.shopSub || '';
  document.getElementById('setGif1').value     = currentSettings.gif1 || '';
  document.getElementById('setGif2').value     = currentSettings.gif2 || '';
  document.getElementById('toggleStrings').classList.toggle('on', !!currentSettings.stringsEnabled);

  // Products
  unsubProducts = onSnapshot(query(collection(db, 'products'), orderBy('name')), snap => {
    products = [];
    snap.forEach(d => products.push({ id: d.id, ...d.data() }));
    renderProducts();
  });

  // Reviews
  unsubReviews = onSnapshot(query(collection(db, 'reviews'), orderBy('createdAt', 'desc')), snap => {
    reviews = [];
    snap.forEach(d => reviews.push({ id: d.id, ...d.data() }));
    renderReviews();
  });
}

// ========== Settings ==========
function toggleStrings() {
  document.getElementById('toggleStrings').classList.toggle('on');
}
window.toggleStrings = toggleStrings;

async function saveSettings() {
  const newSettings = {
    shopName: document.getElementById('setShopName').value.trim() || 'Lynbluu',
    shopSub:  document.getElementById('setShopSub').value.trim(),
    gif1:     document.getElementById('setGif1').value.trim(),
    gif2:     document.getElementById('setGif2').value.trim(),
    stringsEnabled: document.getElementById('toggleStrings').classList.contains('on')
  };

  try {
    await setDoc(doc(db, 'settings', 'main'), newSettings, { merge: true });
    currentSettings = newSettings;
    showToast('✓ บันทึกการตั้งค่าสำเร็จ', 'success');
  } catch (e) {
    console.error(e);
    showToast('✕ เกิดข้อผิดพลาด — ลอง login ใหม่', 'error');
  }
}
window.saveSettings = saveSettings;

// ========== Products ==========
function renderProducts() {
  const box = document.getElementById('productsList');
  if (products.length === 0) {
    box.innerHTML = '<div class="empty">ยังไม่มีสินค้า</div>';
    return;
  }
  box.innerHTML = '';
  products.forEach(p => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <div class="info"><div class="name">${escapeHtml(p.name)}</div></div>
      <button class="btn danger small" onclick="deleteProduct('${p.id}')">ลบ</button>
    `;
    box.appendChild(div);
  });
}

async function addProducts() {
  const txt = document.getElementById('inpNewProducts').value.trim();
  if (!txt) return showToast('⚠ กรุณาพิมพ์ชื่อสินค้า', 'error');
  const lines = txt.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length === 0) return showToast('⚠ ไม่พบสินค้า', 'error');

  try {
    for (const name of lines) {
      await addDoc(collection(db, 'products'), { name });
    }
    document.getElementById('inpNewProducts').value = '';
    showToast(`✓ เพิ่ม ${lines.length} สินค้าสำเร็จ`, 'success');
  } catch (e) {
    console.error(e);
    showToast('✕ เกิดข้อผิดพลาด', 'error');
  }
}
window.addProducts = addProducts;

async function deleteProduct(id) {
  if (!confirm('ต้องการลบสินค้านี้?')) return;
  try {
    await deleteDoc(doc(db, 'products', id));
    showToast('✓ ลบสินค้าสำเร็จ', 'success');
  } catch (e) {
    console.error(e);
    showToast('✕ เกิดข้อผิดพลาด', 'error');
  }
}
window.deleteProduct = deleteProduct;

// ========== Reviews ==========
function renderReviews() {
  const box = document.getElementById('reviewsList');
  if (reviews.length === 0) {
    box.innerHTML = '<div class="empty">ยังไม่มีรีวิว</div>';
    return;
  }
  box.innerHTML = '';
  reviews.forEach(r => {
    const div = document.createElement('div');
    div.className = 'list-item';
    const stars = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
    div.innerHTML = `
      <div class="info">
        <div class="name">${escapeHtml(r.name)} <span style="color:var(--silver-2); font-size:0.75rem;">${stars}</span></div>
        <div class="meta">${escapeHtml(r.product)} — ${escapeHtml(r.text)}</div>
      </div>
      <button class="btn danger small" onclick="deleteReview('${r.id}')">ลบ</button>
    `;
    box.appendChild(div);
  });
}

async function deleteReview(id) {
  if (!confirm('ต้องการลบรีวิวนี้?')) return;
  try {
    await deleteDoc(doc(db, 'reviews', id));
    showToast('✓ ลบรีวิวสำเร็จ', 'success');
  } catch (e) {
    console.error(e);
    showToast('✕ เกิดข้อผิดพลาด', 'error');
  }
}
window.deleteReview = deleteReview;

// ========== Utils ==========
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}
</script>

</body>
</html>
